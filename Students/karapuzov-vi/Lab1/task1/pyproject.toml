[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-board-lab"
version = "0.1.0"
description = "Training task board"
requires-python = ">=3.11"
dependencies = [
    "fastapi<=0.116",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<0.31",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
